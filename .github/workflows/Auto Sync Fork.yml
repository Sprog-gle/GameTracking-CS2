name: Auto Sync Fork

on:
  schedule:
    # Runs every 15 minutes. 
    # (Use '0 * * * *' if you only want it to check once an hour)
    - cron: '*/15 * * * *'
  workflow_dispatch: # This adds a button so you can still trigger it manually if needed

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # This is required so the action can push the synced code
    steps:
      - name: Sync fork with upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh repo sync ${{ github.repository }}
